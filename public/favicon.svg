<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Background tile -->
  <rect width="36" height="36" rx="9" fill="url(#bg)"/>
  <!-- Glass top highlight -->
  <rect x="1" y="1" width="34" height="14" rx="8" fill="white" fill-opacity="0.08"/>
  <!-- PCB corner markers -->
  <circle cx="4.5" cy="4.5" r="1.5" stroke="white" stroke-width="0.8" fill="none" stroke-opacity="0.45"/>
  <circle cx="31.5" cy="4.5" r="1.5" stroke="white" stroke-width="0.8" fill="none" stroke-opacity="0.45"/>
  <circle cx="4.5" cy="31.5" r="1.5" stroke="white" stroke-width="0.8" fill="none" stroke-opacity="0.45"/>
  <circle cx="31.5" cy="31.5" r="1.5" stroke="white" stroke-width="0.8" fill="none" stroke-opacity="0.45"/>
  <!-- H — left pillar -->
  <rect x="7" y="8" width="6" height="20" rx="1.5" fill="white"/>
  <!-- H — right pillar -->
  <rect x="23" y="8" width="6" height="20" rx="1.5" fill="white"/>
  <!-- H — crossbar left half -->
  <rect x="13" y="15.5" width="3.5" height="5" fill="white"/>
  <!-- H — crossbar right half -->
  <rect x="19.5" y="15.5" width="3.5" height="5" fill="white"/>
  <!-- Centre node — gradient fill punched through crossbar gap, white ring overlay -->
  <circle cx="18" cy="18" r="3.2" fill="url(#bg)"/>
  <circle cx="18" cy="18" r="3.2" stroke="white" stroke-width="1.8" fill="none"/>
</svg>
